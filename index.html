<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>विधि चक्र — Content Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Philosopher:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080610;--bg2:#0F0C1A;--bg3:#161228;
  --gold:#F0C040;--gold2:rgba(240,192,64,0.25);
  --text:#F0EAD6;--muted:#7060A0;--dim:#2A2040;
  --acc:#9966DD;--red:#FF5050;--green:#40C880;
  --amber:#F0A030;
}
body{background:var(--bg);color:var(--text);font-family:'EB Garamond',serif;min-height:100vh;padding:0 0 60px}

/* ── TOP NAV ── */
.topnav{background:linear-gradient(135deg,#0F0820,#07040F);border-bottom:1px solid rgba(240,192,64,0.2);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.brand{font-family:'Tiro Devanagari Sanskrit',serif;font-size:20px;color:var(--gold);letter-spacing:1px}
.brand span{font-family:'Philosopher',serif;font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;display:block;margin-top:2px}

/* ── CARD TYPE TABS ── */
.type-scroll{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 10px;scrollbar-width:none}
.type-scroll::-webkit-scrollbar{display:none}
.type-btn{flex-shrink:0;padding:7px 16px;border-radius:20px;border:1px solid var(--dim);background:var(--bg2);color:var(--muted);font-size:12px;cursor:pointer;font-family:'Philosopher',serif;letter-spacing:1px;transition:all .2s}
.type-btn.active{background:rgba(240,192,64,0.12);border-color:var(--gold);color:var(--gold)}

/* ── INPUTS ── */
.inputs{padding:0 16px 14px}
.field{margin-bottom:12px}
.field label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:'Philosopher',serif;display:block;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--bg3);border:1px solid var(--dim);border-radius:6px;padding:10px 12px;color:var(--text);font-family:'Tiro Devanagari Sanskrit',serif;font-size:15px;outline:none;line-height:1.6;transition:border-color .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}
.field textarea{resize:vertical}

/* ── COLOR THEME SELECTOR ── */
.theme-row{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.theme-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s;position:relative}
.theme-dot.active{border-color:var(--gold);transform:scale(1.15)}

/* ── PREVIEW ── */
.preview-wrap{padding:0 16px;margin-bottom:14px}
.preview-label{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;font-family:'Philosopher',serif;margin-bottom:8px}
.canvas-outer{border:1px solid var(--dim);border-radius:10px;overflow:hidden;background:#000;position:relative;width:100%;max-width:240px;margin:0 auto;aspect-ratio:9/16}
canvas#cv{width:100%;height:100%;display:block}

/* ── ACTIONS ── */
.actions{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.btn{padding:12px;border-radius:6px;font-family:'Philosopher',serif;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;border:none;transition:all .2s;text-align:center}
.btn-gold{background:var(--gold);color:#1A0800}
.btn-outline{background:transparent;border:1px solid var(--dim);color:var(--muted)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}

.divider{height:1px;background:linear-gradient(to right,transparent,var(--gold2),transparent);margin:4px 16px 16px}

/* ── SUGGESTIONS ── */
.suggestions{padding:0 16px}
.sug-title{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;font-family:'Philosopher',serif;margin-bottom:10px}
.sug-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sug-card{background:var(--bg2);border:1px solid var(--dim);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .2s}
.sug-card:hover{border-color:var(--acc);background:rgba(153,102,221,0.08)}
.sug-card .sug-tag{font-size:9px;color:var(--acc);letter-spacing:2px;text-transform:uppercase;font-family:'Philosopher',serif;margin-bottom:4px}
.sug-card .sug-text{font-family:'Tiro Devanagari Sanskrit',serif;font-size:13px;color:var(--text);line-height:1.5}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="topnav">
  <div>
    <div class="brand">विधि चक्र</div>
    <div class="brand"><span>CONTENT CARDS</span></div>
  </div>
  <div style="font-family:'Tiro Devanagari Sanskrit',serif;font-size:22px;color:var(--gold)">ॐ</div>
</div>

<!-- CARD TYPE TABS -->
<div class="type-scroll" id="type-tabs">
  <button class="type-btn active" onclick="setType('gyan',this)">📿 ज्ञान</button>
  <button class="type-btn" onclick="setType('upay',this)">🔮 उपाय</button>
  <button class="type-btn" onclick="setType('prashna',this)">❓ प्रश्न</button>
  <button class="type-btn" onclick="setType('mantra',this)">🔱 मन्त्र</button>
  <button class="type-btn" onclick="setType('rashi',this)">⭐ राशि</button>
  <button class="type-btn" onclick="setType('tathya',this)">📖 तथ्य</button>
</div>

<!-- VIEW TOGGLE -->
<div style="display:flex;gap:10px;padding:0 16px 14px">
  <button class="type-btn active" id="view-static" onclick="setView('static',this)" style="flex:1;text-align:center">🖼 Static Card</button>
  <button class="type-btn" id="view-anim" onclick="setView('anim',this)" style="flex:1;text-align:center">🎬 Animation</button>
</div>

<!-- THEME DOTS -->
<div style="padding:4px 16px 4px;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:'Philosopher',serif">Theme</div>
<div class="theme-row" id="theme-row">
  <div class="theme-dot active" data-theme="shakti" style="background:radial-gradient(#B83880,#14021C)" onclick="setTheme('shakti',this)" title="Shakti"></div>
  <div class="theme-dot" data-theme="shiva" style="background:radial-gradient(#6644FF,#0A0A18)" onclick="setTheme('shiva',this)" title="Shiva"></div>
  <div class="theme-dot" data-theme="vishnu" style="background:radial-gradient(#2288FF,#001020)" onclick="setTheme('vishnu',this)" title="Vishnu"></div>
  <div class="theme-dot" data-theme="ganesh" style="background:radial-gradient(#FF8C00,#180800)" onclick="setTheme('ganesh',this)" title="Ganesh"></div>
  <div class="theme-dot" data-theme="saraswati" style="background:radial-gradient(#00BFFF,#001428)" onclick="setTheme('saraswati',this)" title="Saraswati"></div>
  <div class="theme-dot" data-theme="cosmic" style="background:radial-gradient(#FFB020,#100A00)" onclick="setTheme('cosmic',this)" title="Cosmic Gold"></div>
</div>

<!-- ACTIONS PANEL -->
<div style="padding:0 16px 10px; display:flex; flex-direction:column; gap:10px;">
  <button class="btn btn-outline" onclick="openSmartPaste()" style="width:100%; font-size:12px; border-color:var(--acc); color:var(--acc)">✨ Smart Paste : Auto-fill from text</button>
  
  <!-- 🏭 Factory Batch Engine Control Panel -->
  <div style="background:var(--bg2); border:1px solid var(--dim); border-radius:8px; padding:12px; margin-top:4px;">
    <div style="font-size:10px; color:var(--gold); letter-spacing:2px; text-transform:uppercase; font-family:'Philosopher',serif; margin-bottom:8px;">
      🏭 Factory Batch Engine
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="btn btn-outline" onclick="triggerCSVTarget()" style="flex:1; font-size:12px; border-color:var(--gold); color:var(--gold);">
        📊 Load Batch CSV / JSON
      </button>
      <input type="file" id="batch-file-input" accept=".csv,.json" style="display:none;" onchange="handleBatchFile(this)"/>
    </div>
    
    <div id="batch-nav-container" style="display:none; margin-top:10px; align-items:center; justify-content:space-between; background:var(--bg3); padding:6px 10px; border-radius:4px;">
      <button onclick="navigateBatch(-1)" style="background:none; border:none; color:var(--gold); cursor:pointer; font-size:16px;">◀</button>
      <span id="batch-index-display" style="font-size:12px; font-family:'Philosopher',serif; color:var(--text);">Row 1 of 1</span>
      <button onclick="navigateBatch(1)" style="background:none; border:none; color:var(--gold); cursor:pointer; font-size:16px;">▶</button>
    </div>
  </div>
</div>

<!-- Smart Paste Modal -->
<div id="sp-modal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);padding:20px 16px;overflow-y:auto">
  <div style="max-width:460px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-family:'Tiro Devanagari Sanskrit',serif;font-size:18px;color:var(--gold)">✨ Smart Paste</div>
      <button onclick="closeSmartPaste()" style="background:none;border:1px solid var(--dim);color:var(--muted);padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px">✕</button>
    </div>
    <textarea id="sp-input" rows="10" placeholder="यहाँ पेस्ट गर्नुहोस्...\n\nउदाहरण:\nशनि साढेसातीको प्रभाव\n१. यो साढे सात वर्ष चल्छ\n२. शनिदेवले कर्मको फल दिन्छन्" style="width:100%;background:var(--bg3);border:1px solid var(--dim);border-radius:6px;padding:12px;color:var(--text);font-family:'Tiro Devanagari Sanskrit',serif;font-size:14px;outline:none;line-height:1.7;resize:vertical;margin-bottom:12px"></textarea>
    <div id="sp-preview" style="display:none;background:var(--bg2);border:1px solid var(--dim);border-radius:6px;padding:12px;margin-bottom:12px;font-size:13px;font-family:'EB Garamond',serif;line-height:1.8"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn btn-outline" onclick="smartParsePeview()" style="font-size:13px">👁 Preview Parse</button>
      <button class="btn btn-gold" onclick="smartPasteApply()" style="font-size:13px">✓ Fill Fields</button>
    </div>
  </div>
</div>

<!-- GLOBAL HOOK CONTAINER REQUIRED ACCROSS ALL WORKFLOWS -->
<div class="inputs" style="padding-bottom: 0;">
  <div class="field" style="margin-bottom:6px">
    <label style="color:var(--acc)">⚡ Universal Hook : (Pattern Interrupt - Global)</label>
    <input id="f-hook" placeholder="जैसे: ⚠️ ९५% मानिसलाई थाहा छैन..." oninput="renderCard();updateWordCount()"/>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px" id="hook-suggestions">
      ${['⚠️ ९५% मानिसलाई थाहा छैन','🔥 धेरैले बेवास्ता गर्छन्','❓ के तपाईंलाई थाहा छ?','🪐 यो कुरा धेरैलाई थाहा छैन'].map(h=>`<span onclick="document.getElementById('f-hook').value='${h}';renderCard();updateWordCount()" style="cursor:pointer;font-size:11px;background:var(--bg3);border:1px solid var(--dim);padding:4px 8px;border-radius:12px;color:var(--muted);font-family:'Tiro Devanagari Sanskrit',serif">${h}</span>`).join('')}
    </div>
  </div>
</div>

<!-- INPUTS (dynamic per type) -->
<div class="inputs" id="inputs-area"></div>

<div class="divider"></div>

<!-- PREVIEW -->
<div class="preview-wrap">
  <div class="preview-label" id="preview-label">Preview : 9:16</div>
  <div class="canvas-outer" id="static-wrap">
    <canvas id="cv"></canvas>
  </div>
  <div class="canvas-outer" id="anim-wrap" style="display:none;position:relative">
    <canvas id="anim-cv" style="width:100%;height:100%;display:block"></canvas>
    <div id="anim-cd-overlay" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none"></div>
  </div>
</div>

<!-- ACTIONS -->
<div class="actions" id="static-actions">
  <button class="btn btn-gold" onclick="downloadCard()">⬇ Download PNG</button>
  <button class="btn btn-outline" onclick="renderCard()">↺ Refresh</button>
</div>

<!-- QUALITY SCORE + AI OPTIMIZE PANEL -->
<div id="quality-panel" style="padding:0 16px;margin-bottom:14px;display:none">
  <div style="background:var(--bg2);border:1px solid var(--dim);border-radius:8px;padding:12px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:'Philosopher',serif">Content Score</div>
      <div id="qs-score" style="font-family:'Philosopher',serif;font-size:18px;font-weight:700"></div>
    </div>
    <div id="qs-checks" style="font-size:12px;line-height:2;font-family:'EB Garamond',serif"></div>
    <button onclick="aiOptimize()" id="ai-opt-btn" class="btn btn-outline" style="width:100%;margin-top:10px;font-size:13px;border-color:var(--acc);color:var(--acc)">✨ AI Optimize : Improve Content</button>
    <div id="ai-opt-result" style="display:none;margin-top:10px;background:var(--bg3);border-radius:6px;padding:10px 12px;font-size:12px;font-family:'EB Garamond',serif;line-height:1.8;color:var(--text)"></div>
  </div>
</div>

<div id="anim-actions" style="display:none;padding:0 16px;margin-bottom:16px">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
    <button class="btn btn-gold" onclick="vcCountdown(3)" style="font-size:12px">⏱ 3s</button>
    <button class="btn btn-gold" onclick="vcCountdown(5)" style="font-size:12px">⏱ 5s</button>
    <button class="btn btn-outline" onclick="vcReset()" style="font-size:12px">↺ Reset</button>
  </div>
  <button class="btn btn-outline" onclick="vcPlay()" id="vc-play-btn" style="width:100%;font-size:13px;margin-bottom:8px">▶ Play immediately</button>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
    <button class="btn btn-gold" onclick="vcStartRecord()" id="vc-rec-btn" style="font-size:12px">⏺ Record WebM</button>
    <button class="btn btn-outline" onclick="vcSaveFrame()" style="font-size:12px;border-color:var(--gold);color:var(--gold)">🖼 Save Frame</button>
  </div>
  <div id="vc-rec-status" style="font-size:11px;color:var(--muted);text-align:center;min-height:16px;margin-bottom:6px;font-family:'Philosopher',serif"></div>
</div>

<div class="divider"></div>

<!-- SUGGESTIONS -->
<div class="suggestions">
  <div class="sug-title">✦ सुझाव : Content Ideas</div>
  <div class="sug-grid" id="sug-grid"></div>
</div>

<script>
const THEMES = {
  shakti:    {bg1:'#1A0020',bg2:'#060008',acc:'#CC44AA',gold:'#FFB0E8',text:'#FFF0FA',sub:'#C080B0',glow:'#FF40CC',sym:'ॐ',cat:'शक्ति'},
  shiva:     {bg1:'#0A0A20',bg2:'#020210',acc:'#6644FF',gold:'#C8B0FF',text:'#F0EEFF',sub:'#8878C0',glow:'#8866FF',sym:'🔱',cat:'शिव'},
  vishnu:    {bg1:'#001428',bg2:'#000810',acc:'#2288EE',gold:'#80D0FF',text:'#E8F4FF',sub:'#5090B0',glow:'#44AAFF',sym:'ॐ',cat:'विष्णु'},
  ganesh:    {bg1:'#1C0800',bg2:'#080200',acc:'#E07020',gold:'#FFD060',text:'#FFF4E0',sub:'#C09050',glow:'#FF9030',sym:'ॐ',cat:'गणेश'},
  saraswati: {bg1:'#001828',bg2:'#000810',acc:'#00A8CC',gold:'#80E8FF',text:'#E0F8FF',sub:'#5098B0',glow:'#00C8F0',sym:'ॐ',cat:'सरस्वती'},
  cosmic:    {bg1:'#140C00',bg2:'#060300',acc:'#CC8800',gold:'#FFE060',text:'#FFF8E0',sub:'#B09040',glow:'#FFB020',sym:'✦',cat:'ब्रह्माण्ड'},
};

const TYPES = {
  gyan:    {label:'ज्ञान',fields:['heading','body','source'],headingPH:'जैसे: शनि ग्रहको प्रभाव',sourcePH:'जैसे: बृहत्पाराशर होरा शास्त्र'},
  upay:    {label:'उपाय',fields:['problem','body','note'],headingPH:'जैसे: घरमा नकारात्मक ऊर्जा',bodyPH:'उपाय वा समाधान नेपालीमा...',notePH:'जैसे: हरेक मंगलबार गर्नुहोस्'},
  prashna: {label:'प्रश्न',fields:['question','answer'],questionPH:'जैसे: जन्म कुण्डलीमा ९ भाव के हो?',answerPH:'उत्तर वा रोचक तथ्य नेपालीमा...'},
  mantra:  {label:'मन्त्र',fields:['mantra','artha'],mantraPH:'जैसे: ॐ नमः शिवाय',arthaPH:'मन्त्रको अर्थ नेपालीमा...'},
  rashi:   {label:'राशि',fields:['rashi','body','keyword'],rashiPH:'जैसे: मेष राशि',bodyPH:'राशिको विशेषता वा आजको फल...',keywordPH:'जैसे: साहस • नेतृत्व • ऊर्जा'},
  tathya:  {label:'तथ्य',fields:['number','heading','body'],numberPH:'जैसे: ७',headingPH:'जैसे: सात ग्रहको महत्त्व',bodyPH:'रोचक वेदिक तथ्य नेपालीमा...'},
};

const SUGGESTIONS = {
  gyan:[
    {tag:'ज्योतिष',text:'शनि साढेसातीको बारेमा के जान्नु जरुरी छ?'},
    {tag:'वास्तु',text:'घरको उत्तर-पूर्व दिशा किन पवित्र मानिन्छ?'}
  ],
  upay:[
    {tag:'घर',text:'घरमा शान्ति ल्याउने ५ वास्तु उपाय'},
    {tag:'धन',text:'शुक्रबारको यो उपायले आर्थिक समस्या हट्छ'}
  ],
  prashna:[
    {tag:'प्रश्न',text:'जन्म कुण्डलीमा ९ घर के हो?'},
    {tag:'प्रश्न',text:'किन मंगलबार मासु खान निषेध गरिन्छ?'}
  ],
  mantra:[
    {tag:'मन्त्र',text:'ॐ गं गणपतये नमः'},
    {tag:'मन्त्र',text:'महामृत्युञ्जय मन्त्र'}
  ],
  rashi:[
    {tag:'राशि',text:'मेष : आजको विशेष फल'},
    {tag:'राशि',text:'वृश्चिक राशिको मुख्य विशेषता'}
  ],
  tathya:[
    {tag:'तथ्य',text:'२७ नक्षत्र र चन्द्रमाको सम्बन्ध'},
    {tag:'तथ्य',text:'१२ राशि र १२ भावको अर्थ'}
  ],
};

let _type='gyan', _theme='shakti';
let _batchData = [];
let _batchCurrentIndex = 0;

function setType(t,btn){
  _type=t;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildInputs();
  buildSuggestions();
  renderCard();
}

function setTheme(t,dot){
  _theme=t;
  document.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('active'));
  dot.classList.add('active');
  renderCard();
}

function buildInputs(){
  const T=TYPES[_type];
  let html='';

  if(_type==='gyan'){
    html=`
      <div class="field"><label>शीर्षक / Heading</label><input id="f-heading" placeholder="${T.headingPH}" oninput="renderCard();updateWordCount()"/></div>
      <div style="font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:'Philosopher',serif;margin-bottom:8px">बुँदाहरू / Points</div>
      ${[1,2,3,4,5].map(i=>`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <div style="width:28px;height:28px;border-radius:50%;background:rgba(153,102,221,0.25);border:1.5px solid rgba(153,102,221,0.6);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Philosopher',serif;font-size:13px;font-weight:700;color:var(--gold)">${i}</div>
        <input id="f-item-${i}" style="flex:1;background:var(--bg3);border:1px solid var(--dim);border-radius:6px;padding:9px 12px;color:var(--text);font-family:'Tiro Devanagari Sanskrit',serif;font-size:14px;outline:none" placeholder="बुँदा ${i}..." oninput="renderCard();updateWordCount()"/>
      </div>`).join('')}
      <div class="field" style="margin-top:4px"><label>स्रोत / Source</label><input id="f-source" placeholder="${T.sourcePH}" oninput="renderCard()"/></div>
      <div id="word-count-bar" style="margin-top:10px;display:none">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:10px;color:var(--muted);font-family:'Philosopher',serif;letter-spacing:1px;text-transform:uppercase">Word Count</span>
          <span id="word-count-num" style="font-size:11px;font-family:'Philosopher',serif;font-weight:700"></span>
        </div>

  } else if(_type==='rashi'){

      <div class="field"><label>कीवर्ड</label><input id="f-keyword" placeholder="${T.keywordPH}" oninput="renderCard()"/></div></div>
      <div class="field"><label>विवरण</label><textarea id="f-body" rows="5" placeholder="${T.bodyPH}" oninput="renderCard()"></textarea></div>`;

function buildSuggestions(){
  const sugs=SUGGESTIONS[_type]||[];
  document.getElementById('sug-grid').innerHTML=sugs.map(s=>`
    <div class="sug-card" onclick="applySuggestion(this)" data-text="${s.text.replace(/"/g,'&quot;')}">
      <div class="sug-tag">${s.tag}</div>
      <div class="sug-text">${s.text}</div>
    </div>`).join('');
}

function applySuggestion(card){
  const text=card.dataset.text;
  const target=document.getElementById('f-heading')||document.getElementById('f-question')||document.getElementById('f-mantra')||document.getElementById('f-problem')||document.getElementById('f-rashi');
  if(target){target.value=text;renderCard();}
}

function renderCard(){
  const cv=document.getElementById('cv');
  if(!cv)return;
  cv.width=540; cv.height=960;
  cv.style.width='100%'; cv.style.height='100%';
  drawCard(cv.getContext('2d'),540,960,false);
  if(_type==='gyan'){updateWordCount();updateQualityScore();}
}

function drawCard(ctx,W,H,full){
  const c=THEMES[_theme];
  const s=W/1080;

  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,c.bg1); bg.addColorStop(1,c.bg2);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  const rg=ctx.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,W*0.7);
  rg.addColorStop(0,c.glow+'22'); rg.addColorStop(1,'transparent');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);

  function sg(col,sz){ctx.shadowColor=col||'transparent';ctx.shadowBlur=(sz||0)*s;ctx.shadowOffsetY=2*s;}
  function cg(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;}
  function gl(x1,x2,y,op){
    const g=ctx.createLinearGradient(x1,y,x2,y);
    g.addColorStop(0,'transparent');g.addColorStop(0.5,c.gold+Math.round(op*255).toString(16).padStart(2,'0'));g.addColorStop(1,'transparent');
    ctx.strokeStyle=g; ctx.lineWidth=1.5*s;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();
  }
  function rr(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
  }

  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const SAFE=Math.round(86*s);
  const CONTENT_W=W-SAFE*2;

  let y=H*0.10;
  const catFS=Math.round(26*s);
  ctx.font=`400 ${catFS}px 'Tiro Devanagari Sanskrit',serif`;
  const catLabel=`${c.sym}  ${TYPES[_type].label}`;
  const catW=ctx.measureText(catLabel).width+Math.round(60*s);
  const catH=Math.round(50*s), catX=W/2-catW/2;
  ctx.fillStyle=c.acc+'20';rr(catX,y,catW,catH,catH/2); ctx.fill();
  ctx.strokeStyle=c.acc+'66'; ctx.lineWidth=1.5*s;rr(catX,y,catW,catH,catH/2); ctx.stroke();
  sg(c.glow,14); ctx.fillStyle=c.gold; ctx.fillText(catLabel,W/2,y+catH*0.70);
  y+=catH+Math.round(16*s); cg();

  // Dynamic overlap adjustment logic across all variations
  const hookExtra=drawHook(ctx,W,H,s,c,sg,cg,SAFE);
  if(hookExtra>0) y+=hookExtra+Math.round(20*s);

  gl(SAFE,W-SAFE,y,0.3); y+=Math.round(36*s);

  const FOOTER_TOP=H*0.875;
  if(_type==='gyan') drawGyan(ctx,W,H,y,FOOTER_TOP,s,c,sg,cg,gl,rr,SAFE,CONTENT_W);
  else if(_type==='upay') drawUpay(ctx,W,H,y,s,c,sg,cg,gl,rr);
  else if(_type==='prashna') drawPrashna(ctx,W,H,y,s,c,sg,cg,gl,rr);
  else if(_type==='mantra') drawMantra(ctx,W,H,y,s,c,sg,cg,gl,rr);
  else if(_type==='rashi') drawRashi(ctx,W,H,y,s,c,sg,cg,gl,rr);
  else if(_type==='tathya') drawTathya(ctx,W,H,y,s,c,sg,cg,gl,rr);

  const fY=FOOTER_TOP;
  gl(SAFE,W-SAFE,fY,0.25);
  sg(c.acc+'66',20);
  ctx.font=`400 ${Math.round(22*s)}px 'Philosopher',serif`;ctx.fillStyle=c.sub+'88';ctx.fillText(getRotatingCTA(),W/2,fY+Math.round(34*s));
  sg(c.glow,35);ctx.fillStyle=c.gold;ctx.font=`400 ${Math.round(52*s)}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillText('विधि चक्र',W/2,fY+Math.round(96*s));
  ctx.fillStyle=c.sub+'66';ctx.font=`400 ${Math.round(20*s)}px 'Philosopher',serif`;ctx.fillText('VIDHI CHAKRA',W/2,fY+Math.round(122*s));
  cg();
}

function wrapLines(ctx,text,font,maxW){
  ctx.font=font;
  const words=text.split(/\s+/); const lines=[]; let cur='';
  words.forEach(w=>{
    const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;
  });
  if(cur)lines.push(cur);
  return lines;
}

function drawGyan(ctx,W,H,contentTop,footerY,s,c,sg,cg,gl,rr,SAFE,CONTENT_W){
  const heading=getVal('f-heading'), source=getVal('f-source');
  const items=[1,2,3,4,5].map(i=>getVal('f-item-'+i)).filter(x=>x);
  if(!heading&&!items.length) return;

  const SAFE_L=SAFE||Math.round(86*s);
  const TEXT_AREA=CONTENT_W||(W-SAFE_L*2);
  let y=contentTop;

  if(heading){
    const hFS=Math.round(54*s), hLH=Math.round(68*s);
    const hLines=wrapLines(ctx,heading,`700 ${hFS}px 'Tiro Devanagari Sanskrit',serif`,TEXT_AREA*0.95);
    sg(c.glow,35);ctx.font=`700 ${hFS}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.gold;
    hLines.forEach((l,i)=>ctx.fillText(l,W/2,y+hFS+i*hLH));
    y+=hLines.length*hLH+Math.round(18*s); cg();
  }

  if(items.length){
    gl(SAFE_L,W-SAFE_L,y,0.25); y+=Math.round(16*s);
    const iFS=Math.round(38*s), iLH=Math.round(52*s);
    const CIRC_R=Math.round(32*s);
    const CIRC_CX=SAFE_L+CIRC_R+Math.round(8*s);
    const TEXT_X=CIRC_CX+CIRC_R+Math.round(20*s);
    const TEXT_W=W-TEXT_X-SAFE_L;
    const ROW_V_PAD=Math.round(22*s), ROW_GAP=Math.round(14*s);

    items.forEach((item,idx)=>{
      const lines=wrapLines(ctx,item,`600 ${iFS}px 'Tiro Devanagari Sanskrit',serif`,TEXT_W);
      const rowH=lines.length*iLH+ROW_V_PAD;
      const midY=y+rowH/2;
      const rowGrad=ctx.createLinearGradient(SAFE_L,y,W-SAFE_L,y);
      rowGrad.addColorStop(0,c.acc+'18'); rowGrad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rowGrad;
      rr(SAFE_L,y,W-SAFE_L*2,rowH,Math.round(14*s)); ctx.fill();
      ctx.strokeStyle=c.gold+'18'; ctx.lineWidth=1.5*s;rr(SAFE_L,y,W-SAFE_L*2,rowH,Math.round(14*s)); ctx.stroke();
      
      ctx.beginPath();ctx.arc(CIRC_CX,midY,CIRC_R,0,Math.PI*2);ctx.fillStyle=c.acc+'30'; ctx.fill();
      ctx.strokeStyle=c.gold+'99'; ctx.lineWidth=Math.round(2.5*s); ctx.stroke();
      sg(c.glow,15);ctx.font=`700 ${Math.round(30*s)}px 'Philosopher',serif`;ctx.fillStyle=c.gold; ctx.textAlign='center';
      ctx.fillText(idx+1,CIRC_CX,midY+Math.round(11*s)); cg();
      
      ctx.textAlign='left';ctx.font=`600 ${iFS}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.text;
      const textY=midY-(lines.length*iLH)/2+iLH*0.78;
      lines.forEach((l,li)=>ctx.fillText(l,TEXT_X,textY+li*iLH));
      ctx.textAlign='center';y+=rowH+ROW_GAP;
    });
    cg();
  }

  if(source){
    y+=Math.round(8*s);ctx.font=`italic 400 ${Math.round(24*s)}px 'EB Garamond',serif`;ctx.fillStyle=c.sub+'66';
    ctx.fillText(': ' + source + ' :', W/2, y+Math.round(24*s));
  }
}

function drawUpay(ctx,W,H,y,s,c,sg,cg,gl,rr){
  const problem=getVal('f-problem'), body=getVal('f-body'), note=getVal('f-note');
  if(problem){
    const pFS=Math.round(42*s);
    const pl=wrapLines(ctx,problem,`700 ${pFS}px 'Tiro Devanagari Sanskrit',serif`,W*0.76);
    const pH=pl.length*pFS*1.38+36*s;
    ctx.fillStyle=c.acc+'28';rr(40*s,y,W-80*s,pH,14*s); ctx.fill();
    ctx.strokeStyle=c.acc+'66'; ctx.lineWidth=1.5*s;rr(40*s,y,W-80*s,pH,14*s); ctx.stroke();
    sg(c.glow,20);ctx.font=`700 ${pFS}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.gold;
    pl.forEach((l,i)=>ctx.fillText(l,W/2,y+pFS*1.1+i*pFS*1.38));
    y+=pH+28*s; cg();
  }
  if(body){
    const steps=body.split('\n').filter(x=>x.trim());
    steps.forEach((step,i)=>{
      const bl=wrapLines(ctx,step,`400 ${Math.round(34*s)}px 'Tiro Devanagari Sanskrit',serif`,W*0.74);
      const rH=bl.length*46*s+40*s;
      const rY=y;
      ctx.fillStyle='rgba(0,0,0,0.38)';rr(40*s,rY,W-80*s,rH,12*s); ctx.fill();
      ctx.strokeStyle=c.gold+'20'; ctx.lineWidth=1.5*s;rr(40*s,rY,W-80*s,rH,12*s); ctx.stroke();
      const cx=88*s, cy=rY+rH/2, cr=28*s;
      ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2);ctx.fillStyle=c.acc+'44'; ctx.fill();
      ctx.strokeStyle=c.gold+'88'; ctx.lineWidth=2*s; ctx.stroke();
      ctx.font=`700 ${Math.round(28*s)}px 'Philosopher',serif`;ctx.fillStyle=c.gold;ctx.fillText(i+1,cx,cy+10*s);
      ctx.font=`400 ${Math.round(34*s)}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.text+'EE';
      const textX=134*s, textY=rY+rH/2-(bl.length*46*s)/2+34*s;ctx.textAlign='left';
      bl.forEach((l,j)=>ctx.fillText(l,textX,textY+j*46*s));
      ctx.textAlign='center';y+=rH+12*s; cg();
    });
  }
  if(note){
    y+=10*s;ctx.font=`italic 400 ${Math.round(26*s)}px 'EB Garamond',serif`;ctx.fillStyle=c.gold+'AA';
    ctx.fillText('⭐ '+note,W/2,y+26*s);
  }
}

function drawPrashna(ctx,W,H,y,s,c,sg,cg,gl,rr){
  const q=getVal('f-question'), a=getVal('f-answer');
  if(q){
    const qFS=Math.round(44*s);
    const ql=wrapLines(ctx,q,`700 ${qFS}px 'Tiro Devanagari Sanskrit',serif`,W*0.82);
    const qH=ql.length*58*s+48*s;
    ctx.fillStyle='rgba(0,0,0,0.4)';rr(40*s,y,W-80*s,qH,14*s); ctx.fill();
    ctx.strokeStyle=c.acc+'55'; ctx.lineWidth=2*s;rr(40*s,y,W-80*s,qH,14*s); ctx.stroke();
    sg(c.glow,18);ctx.font=`700 ${qFS}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.gold;
    ql.forEach((l,i)=>ctx.fillText(l,W/2,y+48*s+i*58*s));
    y+=qH+24*s; cg();
  }
  if(a){
    gl(80*s,W-80*s,y,0.35); y+=40*s;
    const aFS=Math.round(36*s);
    const al=wrapLines(ctx,a,`400 ${aFS}px 'Tiro Devanagari Sanskrit',serif`,W*0.80);
    const aH=al.length*54*s+48*s;
    ctx.fillStyle='rgba(0,0,0,0.32)';rr(50*s,y,W-100*s,aH,14*s); ctx.fill();
    ctx.strokeStyle=c.gold+'25'; ctx.lineWidth=1.5*s;rr(50*s,y,W-100*s,aH,14*s); ctx.stroke();
    ctx.font=`400 ${aFS}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.text+'EE';
    al.forEach((l,i)=>ctx.fillText(l,W/2,y+46*s+i*54*s));
    cg();
  }
}

function drawMantra(ctx,W,H,y,s,c,sg,cg,gl,rr){
  const mantra=getVal('f-mantra'), artha=getVal('f-artha');
  if(mantra){
    sg(c.glow,50);ctx.font=`700 ${Math.round(62*s)}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.gold;
    const ml=wrapLines(ctx,mantra,`700 ${Math.round(62*s)}px 'Tiro Devanagari Sanskrit',serif`,W*0.84);
    ml.forEach((l,i)=>ctx.fillText(l,W/2,y+66*s+i*76*s));
    y+=ml.length*76*s+32*s; cg();
  }
  if(artha){
    gl(70*s,W-70*s,y,0.4); y+=10*s;
    ctx.fillStyle=c.acc+'22';ctx.fillRect(0,y,W,38*s);
    sg(c.acc+'99',15);ctx.font=`400 ${Math.round(22*s)}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.acc+'CC';
    ctx.fillText(': अर्थ :', W/2, y+28*s);
    y+=46*s;gl(70*s,W-70*s,y,0.4); y+=24*s; cg();
    const al=wrapLines(ctx,artha,`400 ${Math.round(36*s)}px 'Tiro Devanagari Sanskrit',serif`,W*0.80);
    const aH=al.length*52*s+44*s;
    ctx.fillStyle='rgba(0,0,0,0.38)';rr(50*s,y,W-100*s,aH,14*s); ctx.fill();
    ctx.font=`400 ${Math.round(36*s)}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.text+'EE';
    al.forEach((l,i)=>ctx.fillText(l,W/2,y+42*s+i*52*s));
    cg();
  }
}

function drawRashi(ctx,W,H,y,s,c,sg,cg,gl,rr){
  const rashi=getVal('f-rashi'), body=getVal('f-body'), keyword=getVal('f-keyword');
  if(rashi){
    sg(c.glow,60);ctx.font=`700 ${Math.round(82*s)}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.gold;
    ctx.fillText(rashi,W/2,y+82*s);
    y+=100*s; cg();
  }
  if(keyword){
    const keys=keyword.split('•').map(k=>k.trim()).filter(Boolean);
    const pillH=44*s, gap=14*s;
    ctx.font=`400 ${Math.round(24*s)}px 'Philosopher',serif`;
    const totalW=keys.reduce((a,k)=>a+ctx.measureText(k).width+50*s,0)+(keys.length-1)*gap;
    let startX=(W-Math.min(totalW,W-80*s))/2;
    keys.forEach(k=>{
      const kW=ctx.measureText(k).width+50*s;
      ctx.fillStyle=c.acc+'33';rr(startX,y,kW,pillH,pillH/2); ctx.fill();
      ctx.strokeStyle=c.gold+'55'; ctx.lineWidth=1.5*s;rr(startX,y,kW,pillH,pillH/2); ctx.stroke();
      ctx.fillStyle=c.text+'CC';ctx.fillText(k,startX+kW/2,y+pillH*0.68);
      startX+=kW+gap;
    });
    y+=pillH+24*s;
  }
  if(body){
    gl(80*s,W-80*s,y,0.3); y+=28*s;
    const bl=wrapLines(ctx,body,`400 ${Math.round(36*s)}px 'Tiro Devanagari Sanskrit',serif`,W*0.80);
    const bH=bl.length*52*s+44*s;
    ctx.fillStyle='rgba(0,0,0,0.35)';rr(50*s,y,W-100*s,bH,14*s); ctx.fill();
    ctx.strokeStyle=c.gold+'22'; ctx.lineWidth=1.5*s;rr(50*s,y,W-100*s,bH,14*s); ctx.stroke();
    ctx.font=`400 ${Math.round(36*s)}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.text+'EE';
    bl.forEach((l,i)=>ctx.fillText(l,W/2,y+42*s+i*52*s));
    cg();
  }
}

function drawTathya(ctx,W,H,y,s,c,sg,cg,gl,rr){
  const num=getVal('f-number'), heading=getVal('f-heading'), body=getVal('f-body');
  if(num){
    sg(c.glow,80);ctx.font=`700 ${Math.round(160*s)}px 'Philosopher',serif`;ctx.fillStyle=c.acc+'33';
    ctx.fillText(num,W/2,y+140*s);
    y+=150*s; cg();
  }
  if(heading){
    sg(c.glow,25);ctx.font=`700 ${Math.round(48*s)}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.gold;
    const hl=wrapLines(ctx,heading,`700 ${Math.round(48*s)}px 'Tiro Devanagari Sanskrit',serif`,W*0.82);
    hl.forEach((l,i)=>ctx.fillText(l,W/2,y+52*s+i*60*s));
    y+=hl.length*60*s+20*s; cg();
  }
  if(body){
    gl(80*s,W-80*s,y,0.3); y+=26*s;
    const bl=wrapLines(ctx,body,`400 ${Math.round(34*s)}px 'Tiro Devanagari Sanskrit',serif`,W*0.78);
    const bH=bl.length*50*s+44*s;
    ctx.fillStyle='rgba(0,0,0,0.35)';rr(50*s,y,W-100*s,bH,14*s); ctx.fill();
    ctx.strokeStyle=c.gold+'22'; ctx.lineWidth=1.5*s;rr(50*s,y,W-100*s,bH,14*s); ctx.stroke();
    ctx.font=`400 ${Math.round(34*s)}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.text+'EE';
    bl.forEach((l,i)=>ctx.fillText(l,W/2,y+42*s+i*50*s));
    cg();
  }
}

let _view='static';
function setView(v,btn){
  _view=v;
  document.querySelectorAll('#view-static,#view-anim').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('static-wrap').style.display=v==='static'?'block':'none';
  document.getElementById('anim-wrap').style.display=v==='anim'?'block':'none';

let _vt=0,_vraf=null,_vplaying=false,_vparticles=[];
const VC_DUR=24;

function vcInitParticles(){
  const cv=document.getElementById('anim-cv');if(!cv)return;
  _vparticles=[];
  for(let i=0;i<55;i++) _vparticles.push({
    x:Math.random()*cv.width, y:Math.random()*cv.height,
    vy:-(0.3+Math.random()*0.7), vx:(Math.random()-0.5)*0.3,
    size:1+Math.random()*2.5, op:0.2+Math.random()*0.6, ph:Math.random()*Math.PI*2
  });
}

function vcSetupCanvas(){
  const cv=document.getElementById('anim-cv'); if(!cv)return null;
  if(cv.width!==540||cv.height!==960){
    cv.width=540; cv.height=960;
    cv.style.width='100%'; cv.style.height='100%';
  }
  return cv.getContext('2d');
}

function vcPlay(){
  const btn=document.getElementById('vc-play-btn');
  if(_vplaying){_vplaying=false;cancelAnimationFrame(_vraf);btn.textContent='▶ Play immediately';return;}
  vcInitParticles();_vt=0;_vplaying=true;btn.textContent='⏸ Pause';
  const start=performance.now();
  function loop(now){
    _vt=Math.min((now-start)/1000,VC_DUR);
    try{vcDrawFrame(_vt);}catch(e){console.error('VC anim error:',e.message);_vplaying=false;btn.textContent='▶ Play immediately';return;}
    if(_vt<VC_DUR&&_vplaying){_vraf=requestAnimationFrame(loop);}
    else{_vplaying=false;btn.textContent='▶ Play immediately';}
  }
  _vraf=requestAnimationFrame(loop);
}

function vcReset(){
  _vplaying=false;cancelAnimationFrame(_vraf);
  document.getElementById('vc-play-btn').textContent='▶ Play immediately';
  _vt=0;vcInitParticles();vcDrawFrame(0);
}

function vcCountdown(secs){
  _vplaying=false;cancelAnimationFrame(_vraf);vcReset();
  let rem=secs;const ov=document.getElementById('anim-cd-overlay');
  function tick(){
    if(rem<=0){ov.innerHTML='';vcPlay();return;}
    ov.innerHTML=`<div style="background:rgba(0,0,0,0.75);border-radius:16px;padding:20px 32px;text-align:center;color:#FFD860;font-family:'Philosopher',serif">
      <div style="font-size:14px;letter-spacing:2px;margin-bottom:8px">📱 Screen recorder ON</div>
      <div style="font-size:64px;font-weight:700;line-height:1">${rem}</div>
    </div>`;
    rem--;setTimeout(tick,1000);
  }
  tick();
}

function vcDrawFrame(t){
  const ctx=vcSetupCanvas(); if(!ctx)return;
  const c=THEMES[_theme];
  const W=ctx.canvas.width, H=ctx.canvas.height, s=W/1080;

  function fe(t,s,e){return 1-(1-Math.min(Math.max((t-s)/(e-s),0),1))*(1-Math.min(Math.max((t-s)/(e-s),0),1));}
  function sg2(col,sz){ctx.shadowColor=col;ctx.shadowBlur=sz*s;ctx.shadowOffsetY=2*s;}
  function cg2(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;}
  function gl2(x1,x2,y,op){
    const g=ctx.createLinearGradient(x1,y,x2,y);
    g.addColorStop(0,'transparent');g.addColorStop(0.5,c.gold+Math.round(op*255).toString(16).padStart(2,'0'));g.addColorStop(1,'transparent');
    ctx.strokeStyle=g;ctx.lineWidth=1.5*s;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();
  }
  function rr2(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
  }
  function wl(text,font,maxW){ctx.font=font;const words=text.split(/\s+/);const lines=[];let cur='';words.forEach(w=>{const tt=cur?cur+' '+w:w;if(ctx.measureText(tt).width>maxW&&cur){lines.push(cur);cur=w;}else cur=tt;});if(cur)lines.push(cur);return lines;}

  const bg=ctx.createRadialGradient(W/2,H*0.3,0,W/2,H*0.3,H*0.9);bg.addColorStop(0,c.bg1);bg.addColorStop(1,c.bg2);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  
  const rg=ctx.createRadialGradient(W/2,H*0.3,0,W/2,H*0.3,W*0.7);
  const pulse=0.10+0.06*Math.sin(t*1.4);rg.addColorStop(0,c.glow+Math.round(pulse*255).toString(16).padStart(2,'0'));rg.addColorStop(1,'transparent');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);

  _vparticles.forEach(p=>{
    if(_vplaying){p.y+=p.vy;p.x+=p.vx;if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}}
    const fl=0.5+0.5*Math.sin(t*3+p.ph);ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=c.gold+Math.round(p.op*fl*160).toString(16).padStart(2,'0');ctx.fill();
  });

  if(t>0.8){
    const rp=fe(t,0.8,4.0);ctx.save();ctx.translate(W/2,H*0.36);ctx.rotate(t*0.07);
    ctx.strokeStyle=c.gold+'44';ctx.lineWidth=1.5*s;ctx.beginPath();ctx.arc(0,0,W*0.42,-Math.PI/2,-Math.PI/2+rp*Math.PI*2);ctx.stroke();
    ctx.rotate(-t*0.14);ctx.strokeStyle=c.acc+'33';ctx.lineWidth=1*s;ctx.beginPath();ctx.arc(0,0,W*0.34,-Math.PI/2+rp*Math.PI*2,-Math.PI/2,true);ctx.stroke();
    ctx.restore();
  }

  const SAFE=Math.round(86*s);
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  let y=H*0.10;

  const catA=fe(t,0,0.8);ctx.globalAlpha=catA;
  const catFS=Math.round(26*s);ctx.font=`400 ${catFS}px 'Tiro Devanagari Sanskrit',serif`;
  const catLabel=`${c.sym}  ${TYPES[_type].label}`;
  const catW=ctx.measureText(catLabel).width+Math.round(60*s),catH=Math.round(50*s),catX=W/2-catW/2;
  ctx.fillStyle=c.acc+'20';rr2(catX,y,catW,catH,catH/2);ctx.fill();
  ctx.strokeStyle=c.acc+'66';ctx.lineWidth=1.5*s;rr2(catX,y,catW,catH,catH/2);ctx.stroke();
  sg2(c.glow,14);ctx.fillStyle=c.gold;ctx.fillText(catLabel,W/2,y+catH*0.70);
  y+=catH+Math.round(20*s);ctx.globalAlpha=1;cg2();
  
  // Overlap protection loop inside the animation generator
  const hook=getVal('f-hook');
  let hookOffset = 0;
  if(hook){
    const hFS=Math.round(30*s);const stripH=Math.round(54*s);const stripY=y;
    const stripGrad=ctx.createLinearGradient(SAFE,stripY,W-SAFE,stripY);
    stripGrad.addColorStop(0,c.acc+'40'); stripGrad.addColorStop(0.5,c.acc+'28'); stripGrad.addColorStop(1,c.acc+'40');
    ctx.fillStyle=stripGrad; ctx.fillRect(SAFE,stripY,W-SAFE*2,stripH);
    sg2(c.glow,18); ctx.font=`700 ${hFS}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.text;
    ctx.fillText(hook,W/2,stripY+stripH*0.70); cg2();
    hookOffset = stripH + Math.round(24*s);
  }

  y += hookOffset;
  gl2(SAFE,W-SAFE,y,0.3);y+=Math.round(22*s);

  const fields=getAnimFields(y/H);
  fields.forEach((f,fi)=>{
    if(!f.text)return;
    const startT=0.8+fi*1.0;const lineA=fe(t,startT,startT+0.7);
    if(lineA<=0)return;
    ctx.globalAlpha=lineA;

    if(f.isLabel){
      gl2(SAFE,W-SAFE,f.y*H,0.35);sg2(c.glow,14);ctx.font=`400 ${Math.round(20*s)}px 'Tiro Devanagari Sanskrit',serif`;
      ctx.fillStyle=c.acc+'CC';ctx.fillText(f.text,W/2,f.y*H+26*s);cg2();
    } else {
      const lines=wl(f.text,`${f.bold?'700':'600'} ${Math.round(f.fs*s)}px 'Tiro Devanagari Sanskrit',serif`,W*0.82);
      const lh=f.fs*1.32*s; 
      const panH=lines.length*lh+32*s;
      const rowGrad=ctx.createLinearGradient(SAFE,f.y*H,W-SAFE,f.y*H);
      rowGrad.addColorStop(0,c.acc+'18');rowGrad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rowGrad;rr2(SAFE,f.y*H,W-SAFE*2,panH,12*s);ctx.fill();
      ctx.strokeStyle=c.gold+(f.bold?'30':'18');ctx.lineWidth=1.5*s;rr2(SAFE,f.y*H,W-SAFE*2,panH,12*s);ctx.stroke();
      sg2(f.bold?c.glow:null,f.bold?22:0);
      ctx.font=`${f.bold?'700':'600'} ${Math.round(f.fs*s)}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=f.bold?c.gold:c.text;
      lines.forEach((l,li)=>{
        const la=fe(t,startT+0.25+li*0.2,startT+0.55+li*0.2);ctx.globalAlpha=la;ctx.fillText(l,W/2,f.y*H+32*s+li*lh);
      });
      ctx.globalAlpha=lineA;cg2();
    }
    ctx.globalAlpha=1;
  });

  const footA=fe(t,VC_DUR-4,VC_DUR-2);ctx.globalAlpha=footA;
  const fY=H*0.875;gl2(SAFE,W-SAFE,fY,0.25);
  sg2(c.acc+'66',20);ctx.font=`400 ${Math.round(22*s)}px 'Philosopher',serif`;ctx.fillStyle=c.sub+'88';ctx.fillText(getRotatingCTA(),W/2,fY+Math.round(34*s));
  sg2(c.glow,35);ctx.fillStyle=c.gold;ctx.font=`400 ${Math.round(52*s)}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillText('विधि चक्र',W/2,fY+Math.round(96*s));
  ctx.fillStyle=c.sub+'66';ctx.font=`400 ${Math.round(20*s)}px 'Philosopher',serif`;ctx.fillText('VIDHI CHAKRA',W/2,fY+Math.round(122*s));
  ctx.globalAlpha=1;cg2();
}

function getAnimFields(calculatedTopYFraction){
  let startYFrac = Math.max(calculatedTopYFraction, 0.24);
  
  if(_type==='gyan'){
    const heading=getVal('f-heading'), source=getVal('f-source');
    const items=[1,2,3,4,5].map(i=>getVal('f-item-'+i)).filter(x=>x);
    const fields=[];
    if(heading){
      const estLines=Math.max(1,Math.ceil(heading.length/14));
      fields.push({text:heading,y:startYFrac,fs:46,bold:true});
      startYFrac+=estLines*0.078+0.03;
    }
    items.forEach((item,idx)=>{
      const estLines=Math.max(1,Math.ceil(item.length/18));
      fields.push({text:item,y:startYFrac,fs:34,bold:false,num:idx+1});
      startYFrac+=estLines*0.082+0.025;
    });
    if(source) fields.push({text:': '+source+' :',y:Math.min(startYFrac,0.82),fs:18,bold:false});
    return fields;
  }
  if(_type==='upay') return[
    {text:getVal('f-problem'),y:startYFrac,fs:42,bold:true},
    {text:getVal('f-body'),y:startYFrac + 0.14,fs:32,bold:false},
    {text:getVal('f-note'),y:startYFrac + 0.44,fs:24,bold:false},
  ];
  if(_type==='prashna') return[
    {text:getVal('f-question'),y:startYFrac,fs:42,bold:true},
    {text:getVal('f-answer'),y:startYFrac + 0.22,fs:34,bold:false},
  ];
  if(_type==='mantra') return[
    {text:getVal('f-mantra'),y:startYFrac,fs:54,bold:true},
    {text:': अर्थ :',y:startYFrac + 0.20,fs:20,bold:false,isLabel:true},
    {text:getVal('f-artha'),y:startYFrac + 0.25,fs:34,bold:false},
  ];
  if(_type==='rashi') return[
    {text:getVal('f-rashi'),y:startYFrac,fs:68,bold:true},
    {text:getVal('f-keyword'),y:startYFrac + 0.16,fs:28,bold:false},
    {text:getVal('f-body'),y:startYFrac + 0.26,fs:34,bold:false},
  ];
  if(_type==='tathya') return[
    {text:getVal('f-number'),y:startYFrac,fs:90,bold:true},
    {text:getVal('f-heading'),y:startYFrac + 0.18,fs:42,bold:true},
    {text:getVal('f-body'),y:startYFrac + 0.32,fs:32,bold:false},
  ];
  return [];
}

let _recorder=null, _recChunks=[];

function vcStartRecord(){
  const cv=document.getElementById('anim-cv');
  const btn=document.getElementById('vc-rec-btn');

  if(_recorder&&_recorder.state==='recording'){ _recorder.stop(); return; }

  vcReset();_recChunks=[];
  try{

    _recorder=new MediaRecorder(stream,{mimeType,videoBitsPerSecond:8000000});
    _recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)_recChunks.push(e.data);};
    _recorder.onstop=()=>{
      btn.textContent='⏺ Record WebM';
      const blob=new Blob(_recChunks,{type:'video/webm'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=`vidhichakra-${Date.now()}.webm`;
      document.body.appendChild(a);a.click();status.textContent='✅ Downloaded!';
    };
    _recorder.start(100);btn.textContent='⏹ Stop';vcPlay();
  }catch(e){status.textContent='❌ Error: '+e.message;}
}

function openSmartPaste(){ document.getElementById('sp-modal').style.display='block'; document.getElementById('sp-input').focus(); }
function closeSmartPaste(){ document.getElementById('sp-modal').style.display='none'; }

function smartParseText(raw){
  const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l);
  const result={heading:'',items:[],source:''};
  const isNumberedLine=l=>/^[१२३४५६७८९1-5][\.\)]\s/.test(l)||/^[•\-–:]\s/.test(l);
  const stripNum=l=>l.replace(/^[१२३४५६७८९1-5][\.\)]\s*/,'').replace(/^[•\-–:]\s*/,'').trim();
  const isSource=l=>/^(स्रोत|source|ref|सन्दर्भ)\s*[:\-]/i.test(l);

  lines.forEach(l=>{
    if(isSource(l)){ result.source=l.replace(/^(स्रोत|source|ref|सन्दर्भ)\s*[:\-]\s*/i,'').trim(); } 
    else if(isNumberedLine(l)){ if(result.items.length<5) result.items.push(stripNum(l)); } 
    else if(!result.heading){ if(l.length<=80) result.heading=l; else if(result.items.length<5) result.items.push(l); } 
    else { if(result.items.length<5) result.items.push(l); }
  });
  return result;
}

function smartParsePeview(){
  const raw=document.getElementById('sp-input').value;if(!raw.trim()) return;
  const r=smartParseText(raw);const pv=document.getElementById('sp-preview');pv.style.display='block';
  pv.innerHTML=`<div style="color:var(--gold);margin-bottom:4px">Heading:</div><div>${r.heading||'—'}</div>`;
}

function smartPasteApply(){
  const raw=document.getElementById('sp-input').value;if(!raw.trim()) return;
  const r=smartParseText(raw);
  setTimeout(()=>{
    if(_type==='gyan'){
      if(r.heading) document.getElementById('f-heading').value=r.heading;
      r.items.forEach((item,i)=>{if(document.getElementById('f-item-'+(i+1))) document.getElementById('f-item-'+(i+1)).value=item;});
      if(r.source) document.getElementById('f-source').value=r.source;
    } else if(_type==='upay'){
      if(r.heading) document.getElementById('f-problem').value=r.heading;
      document.getElementById('f-body').value=r.items.join('\n');
    } else if(_type==='prashna'){
      if(r.heading) document.getElementById('f-question').value=r.heading;
      if(r.items.length) document.getElementById('f-answer').value=r.items.join(' ');
    }
    renderCard(); closeSmartPaste();
  },50);
}

function triggerCSVTarget() { document.getElementById('batch-file-input').click(); }

function handleBatchFile(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    if (file.name.endsWith('.json')) { parseBatchJSON(text); } else { parseBatchCSV(text); }
  };
  reader.readAsText(file);
}

function parseBatchCSV(text) {
  _batchData = [];const lines = text.split(/\r?\n/);if (lines.length < 2) return;
  const headers = lines[0].split(',').map(h => h.trim().replace(/["']/g, ''));
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const values = lines[i].split(',').map(v => v.trim().replace(/["']/g, ''));let entry = {};
    headers.forEach((header, idx) => { if (values[idx]) entry[header] = values[idx]; });
    _batchData.push(entry);
  }
  if (_batchData.length > 0) initBatchMode();
}

function parseBatchJSON(text) {
  try { const data = JSON.parse(text); _batchData = Array.isArray(data) ? data : [data]; initBatchMode(); } 
  catch (e) { alert("JSON Structural Error"); }
}

function initBatchMode() { _batchCurrentIndex = 0; document.getElementById('batch-nav-container').style.display = 'flex'; applyBatchRowToInputs(); }

function navigateBatch(direction) {
  if (_batchData.length === 0) return; _batchCurrentIndex += direction;
  if (_batchCurrentIndex >= _batchData.length) _batchCurrentIndex = 0;
  if (_batchCurrentIndex < 0) _batchCurrentIndex = _batchData.length - 1;
  applyBatchRowToInputs();
}

function applyBatchRowToInputs() {
  const row = _batchData[_batchCurrentIndex];
  document.getElementById('batch-index-display').textContent = `Post ${_batchCurrentIndex + 1} of ${_batchData.length}`;
  
  if (row.hook) document.getElementById('f-hook').value = row.hook;

  if (_type === 'gyan') {
    if (row.heading) document.getElementById('f-heading').value = row.heading;
    for (let i = 1; i <= 5; i++) {
      const field = document.getElementById(`f-item-${i}`);
      if (field) field.value = row[`item${i}`] || row[`item_${i}`] || '';
    }
    if (row.source) document.getElementById('f-source').value = row.source;
  } 
  else if (_type === 'upay') {
    if (row.problem || row.heading) document.getElementById('f-problem').value = row.problem || row.heading;
    if (row.body || row.remedy) document.getElementById('f-body').value = row.body || row.remedy;
    if (row.note) document.getElementById('f-note').value = row.note;
  }
  else if (_type === 'prashna') {
    if (row.question || row.heading) document.getElementById('f-question').value = row.question || row.heading;
    if (row.answer || row.body) document.getElementById('f-answer').value = row.answer || row.body;
  }
  else if (_type === 'mantra') {
    if (row.mantra) document.getElementById('f-mantra').value = row.mantra;
    if (row.artha) document.getElementById('f-artha').value = row.artha;
  }
  else if (_type === 'rashi') {
    if (row.rashi) document.getElementById('f-rashi').value = row.rashi;
    if (row.keyword) document.getElementById('f-keyword').value = row.keyword;
    if (row.body) document.getElementById('f-body').value = row.body;
  }
  else if (_type === 'tathya') {
    if (row.number) document.getElementById('f-number').value = row.number;
    if (row.heading) document.getElementById('f-heading').value = row.heading;
    if (row.body) document.getElementById('f-body').value = row.body;
  }
  renderCard(); if (_view === 'anim') vcReset();
}

function drawHook(ctx,W,H,s,c,sg,cg,SAFE){
  const hook=getVal('f-hook'); if(!hook) return 0;
  const hFS=Math.round(30*s);const stripH=Math.round(54*s);const stripY=H*0.10+Math.round(54*s);
  const stripGrad=ctx.createLinearGradient(SAFE,stripY,W-SAFE,stripY);
  stripGrad.addColorStop(0,c.acc+'40'); stripGrad.addColorStop(0.5,c.acc+'28'); stripGrad.addColorStop(1,c.acc+'40');
  ctx.fillStyle=stripGrad; ctx.fillRect(SAFE,stripY,W-SAFE*2,stripH);
  sg(c.glow,18); ctx.font=`700 ${hFS}px 'Tiro Devanagari Sanskrit',serif`;ctx.fillStyle=c.text;
  ctx.fillText(hook,W/2,stripY+stripH*0.70); cg();
  return stripH;
}

async function aiOptimize(){
  const btn=document.getElementById('ai-opt-btn');const result=document.getElementById('ai-opt-result');if(!result) return;
  btn.textContent='⏳ Optimizing...'; btn.disabled=true;
  setTimeout(() => {
    result.style.display='block';
    result.innerHTML=`<div style="color:var(--gold); font-weight:700">✨ एआई सुझाव :</div>
    <div>हुक: ⚠️ धेरैले यो ज्योतिषीय रहस्य बेवास्ता गर्छन्!</div>
    <button onclick="applyAiSuggestions()" class="btn btn-gold" style="width:100%;margin-top:10px;font-size:12px">✓ Apply Script</button>`;
    btn.textContent='✨ AI Optimize : Improve Content'; btn.disabled=false;
  }, 1200);
}

function applyAiSuggestions(){ document.getElementById('f-hook').value = "⚠️ धेरैले यो ज्योतिषीय रहस्य बेवास्ता गर्छन्!"; renderCard(); }

buildInputs();buildSuggestions();window.addEventListener('load',()=>{ setTimeout(renderCard,200); });
</script>
